url: https://PM-Cardoso.github.io/DPMM/

template:
  bootstrap: 5
  bootswatch: flatly
  search: true
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  bslib:
    primary: "#1d4ed8"
    secondary: "#64748b"
    success: "#16a34a"
    info: "#0891b2"
    base_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    headings-font-weight: 700
    border-radius: "0.5rem"
    btn-border-radius: "0.375rem"
    navbar-bg: "#0f172a"
    navbar-light-color: "rgba(255,255,255,0.85)"
    navbar-light-hover-color: "#ffffff"
    navbar-light-active-color: "#ffffff"
    navbar-light-brand-color: "#ffffff"
    navbar-light-brand-hover-color: "#93c5fd"

repo:
  url:
    home: https://github.com/PM-Cardoso/DPMM
    source: https://github.com/PM-Cardoso/DPMM/blob/main/
    issue: https://github.com/PM-Cardoso/DPMM/issues/

home:
  title: "DPMM — Dirichlet Process Mixture Models"
  description: >
    A library of model fitting functions, diagnostics tools, and plotting
    functions for Dirichlet Process Mixture Models (DPMM), developed to
    impute missing predictor data in counterfactual prediction models.
  links:
    - text: "GitHub repository"
      href: https://github.com/PM-Cardoso/DPMM
    - text: "Report a bug"
      href: https://github.com/PM-Cardoso/DPMM/issues

footer:
  structure:
    left: developed_by
    right: built_with

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/PM-Cardoso/DPMM
      aria-label: GitHub

reference:
  - title: "Model fitting"
    desc: >
      Fit the Dirichlet Process Mixture Model and draw posterior samples.
    contents:
      - runModel
      - posterior_dpmm
      - sumLogPostDens
      - sampler_conditional_RW
      - sampler_conditional_RW_block
  - title: "Prediction"
    desc: >
      Generate predictions from a fitted DPMM.
    contents:
      - predict_dpmm_fit
  - title: "Diagnostics and plotting"
    desc: >
      Visualise model fit, convergence, and pairwise relationships.
    contents:
      - plot_alpha
      - plot_dpmm_fit
      - plot_ggpairs
  - title: "Synthetic datasets"
    desc: >
      Example datasets used to demonstrate and test the package.
    contents:
      - dataset_1
      - dataset_2
      - dataset_3
      - dataset_4
      - dataset_5
      - dataset_6
